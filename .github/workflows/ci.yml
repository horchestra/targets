name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [docker, ansible, k8s]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.target }}/go.mod
          cache-dependency-path: ${{ matrix.target }}/go.sum
      - name: gofmt
        working-directory: ${{ matrix.target }}
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "gofmt:"; echo "$out"; exit 1; }
      - working-directory: ${{ matrix.target }}
        run: go build ./...
      - working-directory: ${{ matrix.target }}
        run: go vet ./...
      - working-directory: ${{ matrix.target }}
        run: go test -race ./...

  image:
    name: image ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [docker, ansible, k8s]
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t targets/${{ matrix.target }}:ci ${{ matrix.target }}
      - name: its labels say the target and the protocol
        run: |
          labels=$(docker image inspect --format '{{json .Config.Labels}}' targets/${{ matrix.target }}:ci)
          echo "$labels" | grep -q '"io.horchestra.pack.target":"${{ matrix.target }}"'
          echo "$labels" | grep -q '"io.horchestra.pack.protocol":"pack.target.v1"'
